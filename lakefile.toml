name = "DynamicalSystems"
defaultTargets = ["DynamicalSystems"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
warn.sorry = true

[[require]]
name = "verso"
scope = "leanprover"
rev = "v4.34.0-rc2"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[require]]
name = "axiom-audit"
git = "https://github.com/leanprover-community/axiom-audit.git"
rev = "main"

[[lean_lib]]
name = "DynamicalSystems"

[[lean_exe]]
name = "generate-docs"
root = "Documentation"
